name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24.11.0"
          cache: npm

      # `prepare` builds the adapter during install, so a broken build fails here.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:plugin
      - run: npm run test:conformance

      - run: npm run build
      - run: npm run build:plugin

      - name: Check the published file lists
        run: |
          npm pack --dry-run
          npm pack --dry-run -w paperclip-plugin-omp-session
